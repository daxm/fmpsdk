# Publishes the fmpsdk-mcp package (mcp/ subdirectory) to PyPI via Trusted
# Publishing (OIDC) -- no stored token. This is a SEPARATE project and pending
# publisher from fmpsdk itself; configure it on PyPI's fmpsdk-mcp project
# settings -> Publishing page, pointing at this workflow filename.
#
# Triggered by pushing an `mcp-v*` tag (e.g. `mcp-v20260829.0`), which
# mcp/deploy_a_release.sh does as its last step after the gate below passes
# locally. The SDK's own `v*` tags never match this, and vice versa.
name: Publish fmpsdk-mcp to PyPI
on:
  push:
    tags:
      - "mcp-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for PyPI's OIDC trusted-publishing exchange
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          set -xe
          python -m pip install --upgrade pip build
          pip install . ./mcp black pytest
      - name: Check formatting
        run: black --check mcp/ tools/
      - name: Generated artifacts are in sync with the source
        run: |
          python tools/gen_openapi.py --check
          python tools/gen_tiers.py --check
      - name: Run mcp test suite
        run: pytest mcp/tests
      - name: Build (from the mcp/ subdirectory)
        run: python -m build --outdir dist mcp/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # Register/update the server in the official MCP Registry. It stores only
      # metadata (mcp/server.json) pointing at the PyPI package just published;
      # ownership is proven by the `mcp-name: io.github.daxm/fmpsdk-mcp` marker
      # in mcp/README.md, which is fmpsdk-mcp's PyPI description. Auth is GitHub
      # OIDC via the id-token:write permission above -- no secret.
      # If this step fails with "Package validation failed", PyPI's JSON API
      # hasn't caught up yet; just re-run the job.
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Sync server.json to the released version
        run: |
          v="${GITHUB_REF_NAME#mcp-v}"
          jq --arg v "$v" '.version = $v | .packages[0].version = $v' mcp/server.json > mcp/server.json.tmp
          mv mcp/server.json.tmp mcp/server.json
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish mcp/server.json
